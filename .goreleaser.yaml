version: 2

project_name: bundle

builds:
  - main: ./cmd/bundle
    binary: bundle
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.revision={{ .ShortCommit }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [linux, darwin, windows]
    goarch: ['386', amd64, arm64]
    ignore:
      - goos: darwin
        goarch: '386'

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  use: github-native

release:
  prerelease: auto
